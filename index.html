<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de estudante de Engenharia de Software na FIAP." />
    <title>Portfólio</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não "piscar".
      // A chave 'theme' é a mesma usada em src/context/ThemeProvider.jsx.
      try {
        var saved = localStorage.getItem('theme')
        document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark')
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
